# Reference only. Pin exact image versions and secrets before use.
services:
  surv-ingestor:
    image: your-registry/surv-ingestor:${VERSION}
    networks: [surv-ingress, surv-app]
    restart: unless-stopped

  surv-stream-processor:
    image: your-registry/surv-stream-processor:${VERSION}
    networks: [surv-app, surv-data]
    restart: unless-stopped

  surv-silo:
    image: your-registry/surv-silo:${VERSION}
    networks: [surv-app, surv-data, surv-observability]
    expose: ["11111", "30000"]
    restart: unless-stopped

  surv-alert-writer:
    image: your-registry/surv-alert-writer:${VERSION}
    networks: [surv-app, surv-data]
    restart: unless-stopped

  surv-api:
    image: your-registry/surv-api:${VERSION}
    networks: [surv-ingress, surv-app, surv-data]
    restart: unless-stopped

networks:
  surv-ingress: {}
  surv-app:
    internal: true
  surv-data:
    internal: true
  surv-observability:
    internal: true
